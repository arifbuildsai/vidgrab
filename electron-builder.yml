appId: net.vidgrab.desktop
productName: VidGrab
copyright: © 2026 Arif Shah
directories:
  output: release
files:
  - src/**
  - ui/**
  - build/icon.png
  - package.json
# The chime is played by afplay, paplay and PowerShell — separate programs that
# cannot read inside app.asar — so it ships beside the asar, not inside it.
extraResources:
  - from: assets/chime.wav
    to: chime.wav
asar: true
compression: normal
# NOTE ON PUBLISHING: electron-builder's default policy is `onTag` — with a v*
# tag and GH_TOKEN in the environment it creates its OWN draft GitHub release
# and uploads every installer plus .blockmap deltas and latest*.yml auto-update
# manifests into it (19 files on the v1.1.0 attempt), racing the release job in
# .github/workflows/build.yml. The release job owns publishing: one body, one
# SHA256SUMS, installers only. So every CI build passes `--publish never` on the
# command line. It must NOT be written as `publish: never` in this file — the
# top-level `publish:` key here expects provider objects, and the string is read
# as a publisher plugin name, failing with "Cannot find module
# 'electron-publisher-never'". GH_TOKEN is still required on the build step for
# electron-builder to download its own helper binaries (nsis, winCodeSign,
# AppImage tooling) from GitHub Releases.
# No `arch:` array on mac/win targets on purpose. When a target lists several
# arches in config, electron-builder builds all of them and the CLI --arm64 /
# --x64 flag does not narrow it — so every CI job produced both bundles and the
# architecture check picked the wrong one. Arch is driven per job on the
# command line instead (see .github/workflows/build.yml).
mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  minimumSystemVersion: '11.0'
  target:
    - dmg
    - zip
  artifactName: VidGrab-${version}-${arch}-${os}.${ext}
win:
  icon: build/icon.png
  target:
    - nsis
  artifactName: VidGrab-Setup-${version}-${arch}-${os}.${ext}
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  allowToChangeInstallationDirectory: false
linux:
  icon: build/icon.png
  category: Utility
  executableName: vidgrab
  synopsis: Save YouTube videos to your computer
  description: VidGrab is a minimal YouTube downloader. Paste a link, pick a quality that really exists for that video, and get an H.264 + AAC MP4 or an MP3 in your Downloads folder.
  maintainer: Arif Shah <10247025+arifbuildsai@users.noreply.github.com>
  target:
    # Names only, no arch array — the CLI drives the arch per job.
    #
    # .deb is produced from the x64 job only. It needs fpm, and electron-builder's
    # bundled fpm is an x86_64 Ruby build that cannot execute on an ARM64 Linux
    # runner ("Exec format error"), so an arm64 runner cannot build any .deb. The
    # linux-arm64 job therefore passes `--linux AppImage` on the command line, which
    # overrides this list. Fedora/RHEL/openSUSE get the AppImage too: rpmbuild is
    # absent from the Ubuntu runners.
    - AppImage
    - deb
  artifactName: VidGrab-${version}-${arch}-${os}.${ext}
