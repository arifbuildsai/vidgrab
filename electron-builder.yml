appId: net.vidgrab.desktop
productName: VidGrab
copyright: © 2026 VidGrab
directories:
  output: release
files:
  - src/**
  - ui/**
  - build/icon.png
  - package.json
asar: true
compression: normal
mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: VidGrab-${version}-${arch}-${os}.${ext}
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: VidGrab-Setup-${version}-${os}.${ext}
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Utility
  artifactName: VidGrab-${version}-${os}.${ext}
