name: build

# VidGrab ships installers for six OS/architecture combinations. Each one is
# built on a runner of its own kind, because a macOS .app cannot be honestly
# produced on Linux, and an NSIS installer cannot be honestly produced on
# anything but Windows. Cross-building under wine or QEMU is used only for the
# local Docker path, never for a published artifact.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            args: --mac --arm64
            artifact: mac-arm64
          # macos-13 was GitHub's last x64 runner and is retired. An ARM64
          # runner builds the x64 .app just fine: there is no native
          # compilation, only the per-arch Electron zip, and hdiutil is
          # arch-agnostic.
          - os: macos-15
            arch: x64
            args: --mac --x64
            artifact: mac-x64
          - os: windows-latest
            arch: x64
            args: --win --x64
            artifact: win-x64
          - os: windows-latest
            arch: arm64
            args: --win --arm64
            artifact: win-arm64
          - os: ubuntu-latest
            arch: x64
            args: --linux --x64
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            arch: arm64
            # AppImage only: an arm64 runner cannot run fpm (x86_64 ruby), so no
            # .deb from this job. The CLI target list overrides electron-builder.yml.
            args: --linux AppImage --arm64
            artifact: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: lint
        run: npm run lint

      # Unsigned on purpose: CSC_IDENTITY_AUTO_DISCOVERY=false stops
      # electron-builder from picking up whatever certificate happens to be in
      # the runner's keychain. macOS builds therefore hit Gatekeeper on first
      # open, which the README documents.
      #
      # GH_TOKEN is not optional. electron-builder downloads its own helper
      # binaries (winCodeSign, nsis, the AppImage tooling) from GitHub Releases,
      # and unauthenticated requests are refused with "GitHub Personal Access
      # Token is not set" — which failed all four non-Linux jobs on the first
      # matrix run. Anonymous pulls are rate-limited per IP, so the token also
      # keeps a re-run from being throttled.
      - name: build ${{ matrix.artifact }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.args }}

      - name: verify the bundle matches its target architecture
        if: startsWith(matrix.artifact, 'mac-')
        run: |
          set -e
          # electron-builder writes arm64 to mac-arm64/ and x64 to the legacy mac/.
          if [ "${{ matrix.arch }}" = "arm64" ]; then DIRS="release/mac-arm64"; else DIRS="release/mac release/mac-x64"; fi
          APP=""
          for d in $DIRS; do [ -d "$d/VidGrab.app" ] && APP="$d/VidGrab.app" && break; done
          test -n "$APP" || { echo "no VidGrab.app under: $DIRS"; ls -R release | head -40; exit 1; }
          BIN="$APP/Contents/MacOS/VidGrab"
          test -f "$BIN" || BIN=$(find "$APP/Contents/MacOS" -type f | head -1)
          test -n "$BIN" || { echo "no executable in $APP/Contents/MacOS"; exit 1; }
          ARCHS=$(lipo -archs "$BIN")
          echo "  $BIN"
          echo "  bundle architectures: $ARCHS   (job wants ${{ matrix.arch }})"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            case "$ARCHS" in *arm64*) ;; *) echo "  MISMATCH: wanted arm64"; exit 1 ;; esac
          else
            case "$ARCHS" in *x86_64*) ;; *) echo "  MISMATCH: wanted x86_64"; exit 1 ;; esac
          fi
          # The chime must sit OUTSIDE the asar: afplay is a separate program and
          # cannot read a path inside app.asar.
          test -f "$APP/Contents/Resources/chime.wav" || { echo "chime.wav missing from Contents/Resources"; exit 1; }
          echo "  ok  $APP is native ${{ matrix.arch }}, chime.wav outside the asar"

      - name: verify the installer mounts and holds the app
        if: startsWith(matrix.artifact, 'mac-')
        run: |
          set -e
          DMG=$(find release -maxdepth 1 -name '*.dmg' | head -1)
          test -n "$DMG" || { echo "no dmg"; exit 1; }
          M=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$M"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$M/VidGrab.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$M/VidGrab.app/Contents/Info.plist"
          test -f "$M/VidGrab.app/Contents/Resources/chime.wav" || { echo "chime missing in dmg"; exit 1; }
          hdiutil detach "$M"

      - name: verify the unpacked bundle carries the chime outside the asar
        if: startsWith(matrix.artifact, 'linux-')
        run: |
          set -e
          # Prefer the arch-specific dir electron-builder writes; fall back to the
          # only unpacked dir present if the naming ever shifts, rather than
          # failing on a path assumption.
          if [ "${{ matrix.arch }}" = "arm64" ]; then WANT="release/linux-arm64-unpacked"; else WANT="release/linux-unpacked"; fi
          U="$WANT"
          if [ ! -d "$U" ]; then
            ALT=$(find release -maxdepth 1 -type d -name 'linux*unpacked*' | head -1)
            [ -n "$ALT" ] && U="$ALT"
          fi
          test -d "$U" || { echo "no unpacked dir (wanted $WANT)"; ls release; exit 1; }
          [ "$U" = "$WANT" ] || echo "  note: using $U instead of $WANT"
          test -f "$U/resources/chime.wav" || { echo "chime.wav missing from resources/"; find "$U" -name 'chime*' ; exit 1; }
          echo "  ok  $U/resources/chime.wav"
          # A native ELF for the job's architecture, not an emulated one.
          BIN=$(find "$U" -maxdepth 1 -type f -name vidgrab | head -1)
          test -n "$BIN" || { echo "no vidgrab binary in $U"; ls "$U" | head -20; exit 1; }
          file "$BIN" | sed 's/^/  /'
          case "${{ matrix.arch }}" in
            arm64) file "$BIN" | grep -q 'aarch64\|ARM aarch64' || { echo "  MISMATCH: not arm64"; exit 1; } ;;
            x64)   file "$BIN" | grep -q 'x86-64' || { echo "  MISMATCH: not x86-64"; exit 1; } ;;
          esac
          echo "  ok  native ${{ matrix.arch }} binary"

      - name: verify the installer holds the chime and the right arch
        if: startsWith(matrix.artifact, 'linux-')
        run: |
          set -e
          # Every linux job produces an AppImage; only x64 also produces a .deb
          # (an arm64 runner cannot execute fpm's x86_64 ruby). Assert the
          # AppImage exists first, so a missing artifact is caught here rather
          # than at upload.
          APPIMG=$(find release -maxdepth 1 -name '*.AppImage' -type f | head -1)
          test -n "$APPIMG" || { echo "no AppImage produced"; ls release; exit 1; }
          test -x "$APPIMG" || { echo "AppImage is not executable: $APPIMG"; exit 1; }
          echo "  ok  executable $(basename "$APPIMG")"
          for pkg in $(find release -maxdepth 1 -name '*.deb' -type f); do
            echo "-- $pkg"
            dpkg-deb -c "$pkg" | grep -E 'chime.wav|/vidgrab$' | sed 's/^/     /'
            dpkg-deb -f "$pkg" Architecture | sed 's/^/     Architecture: /'
            dpkg-deb -c "$pkg" | grep -q chime.wav || { echo "   chime.wav absent from $pkg"; exit 1; }
            echo "   ok  chime.wav shipped in $(basename "$pkg")"
          done

      - name: verify the unpacked bundle carries the chime, and the installer exists
        if: startsWith(matrix.artifact, 'win-')
        shell: pwsh
        run: |
          # An NSIS exe is a self-extracting stub: its resources live inside a
          # nested payload archive that 7z lists as one opaque entry, not as
          # individual files. So the chime is asserted on the unpacked tree (what
          # the installer is built from), mirroring the Linux check — not by
          # listing the exe.
          $want = if ('${{ matrix.arch }}' -eq 'arm64') { 'release/win-arm64-unpacked' } else { 'release/win-unpacked' }
          $dir = $want
          if (-not (Test-Path $dir)) {
            $alt = Get-ChildItem release -Directory -Filter 'win*unpacked*' | Select-Object -First 1
            if ($alt) { $dir = $alt.FullName; Write-Host "  note: using $dir instead of $want" }
          }
          if (-not (Test-Path $dir)) {
            Write-Host "  no unpacked dir (wanted $want)"; Get-ChildItem release | ForEach-Object { Write-Host "    $($_.Name)" }; exit 1
          }
          $chime = Join-Path $dir 'resources/chime.wav'
          if (-not (Test-Path $chime)) { Write-Host "  chime.wav absent from $chime"; Get-ChildItem (Join-Path $dir 'resources') | ForEach-Object { Write-Host "    $($_.Name)" }; exit 1 }
          Write-Host "  ok  $chime outside the asar"
          # The app's own exe must be in the tree the installer packs.
          $appExe = Get-ChildItem $dir -Filter '*.exe' -File | Select-Object -First 1
          if (-not $appExe) { Write-Host "  no exe in $dir"; exit 1 }
          Write-Host "  ok  $($appExe.Name)  $([math]::Round($appExe.Length/1MB,1)) MB"
          $exe = Get-ChildItem release -Filter '*.exe' -File | Where-Object { $_.Name -notlike '*unblocked*' } | Select-Object -First 1
          if (-not $exe) { Write-Host "  no NSIS installer produced"; exit 1 }
          Write-Host "  ok  installer $($exe.Name)  $([math]::Round($exe.Length/1MB,1)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # .blockmap files are the manifest electron-updater uses for differential
      # downloads. VidGrab has no update feed and does not load electron-updater
      # (no publish: key, no autoUpdater in src/), so nothing consumes them — and
      # leaving them here would put rows in the release table and lines in
      # SHA256SUMS for files that are not actually attached to the release.
      - name: drop artifacts nothing can use
        run: |
          find assets -maxdepth 1 -type f -name '*.blockmap' -print -delete | sed 's/^/  removed: /'
          echo "  remaining:"
          ls -1 assets | sed 's/^/    /'

      - name: checksums
        run: |
          cd assets
          # Everything except the checksum file itself; some globs match nothing
          # on a given tag, so iterate the real directory instead of a pattern.
          : > SHA256SUMS
          find . -maxdepth 1 -type f ! -name SHA256SUMS -exec sha256sum {} + \
            | sed 's|\./||' | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      # The body is generated from the files that actually exist, so it can never
      # advertise an artifact name or a checksum that does not match this tag.
      - name: write the release body
        run: |
          set -e
          TAG=${GITHUB_REF#refs/tags/}
          {
            echo "> **Unsigned builds.** No Developer ID certificate and no notarisation, so macOS"
            echo "> Gatekeeper and Windows SmartScreen each block the first open of a downloaded copy,"
            echo "> and a Linux AppImage needs its executable bit set. This is a certificate gap, not a"
            echo "> tampered download — check the table below, then read"
            echo "> [Troubleshooting](https://github.com/arifbuildsai/vidgrab#troubleshooting)."
            echo
            echo "## Which file do I want? ($TAG)"
            echo
            echo "| File | For | Size | SHA256 |"
            echo "|---|---|---:|---|"
            for f in assets/*; do
              b=$(basename "$f")
              [ "$b" = "SHA256SUMS" ] && continue
              sz=$(du -m "$f" | cut -f1)
              h=$(sha256sum "$f" | cut -d' ' -f1)
              case "$b" in
                *arm64-mac.dmg)  use="macOS — **Apple Silicon** (M1+). Unsure?  → About This Mac → Chip says *Apple M…*" ;;
                *x64-mac.dmg)    use="macOS — **Intel**" ;;
                *arm64-mac.zip)  use="macOS Apple Silicon, unzipped instead of mounted" ;;
                *x64-mac.zip)    use="macOS Intel, unzipped instead of mounted" ;;
                *x64-win.exe)    use="Windows — **x64**, the overwhelming majority of PCs" ;;
                *arm64-win.exe)  use="Windows on **ARM** — Snapdragon X, Surface Pro 11" ;;
                *x86_64-linux.AppImage) use="Linux x64 — any distro, no install, run directly" ;;
                *arm64-linux.AppImage) use="Linux ARM64 — any distro (Pi 5, Graviton, ARM laptops)" ;;
                *amd64-linux.deb) use="Debian / Ubuntu / Mint / Pop!\_OS — x64 (menu entry + icon)" ;;
                *)               use="—" ;;
              esac
              echo "| \`$b\` | $use | ${sz} MB | \`$h\` |"
            done
            echo
            echo "Verify your copy:"
            echo
            echo '```sh'
            echo 'shasum -a 256 -c SHA256SUMS        # macOS / Linux'
            echo "Get-FileHash .\\VidGrab-Setup-${TAG#v}-x64-win.exe -Algorithm SHA256   # Windows PowerShell"
            echo '```'
            echo
            echo "## Install"
            echo
            echo "- **macOS** — open the DMG, drag VidGrab into Applications, then clear the quarantine"
            echo "  flag once: \`sudo xattr -dr com.apple.quarantine /Applications/VidGrab.app\`"
            echo "- **Windows** — run the installer; one-click into your user profile, no admin rights."
            echo "  SmartScreen: **More info → Run anyway**."
            echo "- **Linux** — \`chmod +x\` the AppImage and run it: works on x64 and ARM64 alike, on any"
            echo "  distro, with no install. On Debian/Ubuntu x64 the \`.deb\` adds a menu entry and icon"
            echo "  (\`sudo dpkg -i\`). Fedora/RHEL/openSUSE/Arch have the AppImage — no RPM is published,"
            echo "  because GitHub's Ubuntu runners ship no usable \`rpmbuild\`."
            echo
            echo "## What is in VidGrab"
            echo
            echo "One link field, one button. Paste a YouTube link, pick a quality that genuinely exists"
            echo "for that video, get an H.264 + AAC MP4 that plays in QuickTime — or an MP3. No account,"
            echo "no extension, no telemetry: the renderer's CSP is \`connect-src 'none'\`, so the page"
            echo "cannot reach the network at all."
            echo
            echo "- **Ranged parallel fetch.** YouTube serves an open-ended GET at ~24 KiB/s and the same"
            echo "  URL with a \`Range\` header at 1.1–2.4 MB/s. VidGrab splits every stream into four"
            echo "  ranged requests and launches them the moment the probe announces a length: a 176 MB"
            echo "  1080p video drops from over an hour to **8.4 minutes**."
            echo "- **Only downloadable qualities are offered.** Each chip is resolved against the real"
            echo "  format list, so a quality the app cannot deliver never appears as a button."
            echo "- **Speed and time left never blank**, through pauses, retries and the final merge."
            echo "- **Cancel is clean** (\`⌘.\` / \`Ctrl+.\`): every slice killed, scratch folder removed."
            echo "- **A completion chime** from the main process, so it sounds with the window backgrounded."
            echo
            echo "Full detail, per-platform notes and the acceptance harness:"
            echo "[README](https://github.com/arifbuildsai/vidgrab#readme)."
            echo
            echo "Built on native runners for macOS (Apple Silicon + Intel), Windows (x64 + ARM64) and"
            echo "Linux (x64 + ARM64). [MIT](https://github.com/arifbuildsai/vidgrab/blob/main/LICENSE)"
            echo "© [Arif Shah](https://github.com/arifbuildsai)."
          } > /tmp/body.md
          cat /tmp/body.md

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=${GITHUB_REF#refs/tags/}
          # --repo is required, not cosmetic: this job checks out nothing, so its
          # working directory is not a git repository and gh refuses to infer
          # which repo the release belongs to ("fatal: not a git repository").
          # Only real installers go up. A stray builder-debug.yml in assets/ would
          # make `gh release create` fail on a non-binary upload.
          find assets -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name 'SHA256SUMS' \) \
            -print0 | xargs -0 gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "VidGrab $TAG" --notes-file /tmp/body.md

      # A release that says "6 native installers" must carry all of them. Naming
      # each expected file catches a job that uploaded nothing, a name electron-builder
      # changed under us, and a glob that silently matched less than it looked like.
      - name: confirm every expected installer is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=${GITHUB_REF#refs/tags/}
          V=${TAG#v}
          HAVE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | sort)
          echo "$HAVE" | sed 's/^/  attached: /'
          echo "$HAVE" | grep -q '^SHA256SUMS$' || { echo "  SHA256SUMS missing"; exit 1; }
          echo "$HAVE" | grep -q 'blockmap' && { echo "  a .blockmap was published — the cleanup step failed"; exit 1; }
          miss=0
          for want in \
            "VidGrab-$V-arm64-mac.dmg" "VidGrab-$V-arm64-mac.zip" \
            "VidGrab-$V-x64-mac.dmg"   "VidGrab-$V-x64-mac.zip" \
            "VidGrab-Setup-$V-x64-win.exe" "VidGrab-Setup-$V-arm64-win.exe" \
            "VidGrab-$V-x86_64-linux.AppImage" "VidGrab-$V-arm64-linux.AppImage" \
            "VidGrab-$V-amd64-linux.deb"; do
            echo "$HAVE" | grep -qx "$want" || { echo "  MISSING: $want"; miss=1; }
          done
          [ "$miss" = 0 ] || { echo "  release is incomplete — not marking it latest"; exit 1; }
          echo "  ok  all 9 installers + SHA256SUMS attached to $TAG"
