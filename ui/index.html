<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VidGrab</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232563eb'/%3E%3Cpath d='M12 5.5v9.4M8.2 11.4 12 15.2l3.8-3.8M5.5 18.5h13' fill='none' stroke='%23fff' stroke-width='2.1' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body data-state="idle">

<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="stage">
  <section class="card">

    <header class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26"><rect width="24" height="24" rx="7" fill="currentColor"/><path d="M12 5.6v9.2M8.3 11.5 12 15.2l3.7-3.7M5.6 18.4h12.8" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="word">Vid<em>Grab</em></span>
    </header>

    <h1>Save any YouTube video.</h1>
    <p class="sub">Paste the link, pick a quality, and it lands in your Downloads folder.</p>

    <form class="drop" id="dl-form" autocomplete="off" novalidate>
      <div class="field" id="field">
        <svg class="ic-link" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13.5a3.5 3.5 0 0 0 5 0l3-3a3.5 3.5 0 0 0-5-5l-1.2 1.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M14 10.5a3.5 3.5 0 0 0-5 0l-3 3a3.5 3.5 0 0 0 5 5l1.2-1.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        <input id="sf_url" type="text" inputmode="url" placeholder="Paste the YouTube link here" aria-label="YouTube video link" spellcheck="false" autocapitalize="off" autofocus>
        <button type="button" class="paste" id="btn-paste" title="Paste from clipboard">Paste</button>
      </div>
      <button type="submit" class="go" id="btn-go">
        <svg class="ic-dl" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10.5 12 15.5l5-5M4.5 19.5h15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="go-label" id="go-label">Download</span>
        <span class="spin" aria-hidden="true"></span>
      </button>
    </form>

    <p class="hint" id="hint">Works with regular videos, Shorts and YouTube Music links.</p>

    <div class="video" id="video" hidden>
      <img id="thumb" alt="" width="148" height="83">
      <div class="vmeta">
        <div class="vt" id="vtitle"></div>
        <div class="vm"><span id="vchan"></span><span class="dot" id="vdot"></span><span id="vdur"></span></div>
      </div>
    </div>

    <div class="quals" id="quals" hidden role="radiogroup" aria-label="Quality"></div>

    <div class="bar" id="bar" hidden>
      <div class="track"><i id="fill"></i></div>
      <div class="brow">
        <strong id="pct">0%</strong>
        <span id="pmeta">Starting…</span>
        <button type="button" class="cancel" id="btn-cancel">Cancel</button>
      </div>
    </div>

    <div class="done" id="done" hidden>
      <svg class="tick" width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="currentColor" stroke-width="2.2" opacity=".28"/><path class="tick-path" d="M10.5 17.4 15.2 22l8.3-9.6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="dmeta">
        <strong id="doneword">Saved</strong>
        <span id="donefile"></span>
      </div>
      <div class="dacts">
        <button type="button" class="ghost" id="btn-reveal">Show in Finder</button>
        <button type="button" class="ghost quiet" id="btn-again">New download</button>
      </div>
    </div>

    <div class="oops" id="oops" hidden role="alert">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 7.4v5.2M12 16.3h.01" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      <span id="oopsmsg"></span>
      <button type="button" class="ghost" id="btn-retry">Try again</button>
    </div>

  </section>

  <footer class="foot">
    <button type="button" class="dirbtn" id="btn-dir" title="Change where videos are saved">
      <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.2A1.7 1.7 0 0 1 5.2 5.5h3.4l1.8 2.2h8.4a1.7 1.7 0 0 1 1.7 1.7v7.9a1.7 1.7 0 0 1-1.7 1.7H5.2a1.7 1.7 0 0 1-1.7-1.7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span id="dirname">Downloads</span>
    </button>
    <span class="ver" id="ver"></span>
  </footer>
</main>

<script src="js/main.js"></script>
</body>
</html>
